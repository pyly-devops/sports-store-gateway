# ---------------------------------------------------------------------------
# Structured access logs (Milestone 8).
#
# The gateway is the only component that sees EVERY request, including the
# ones that never reach a backend, so this is where a request log belongs.
# The five Python services deliberately do not log per request — that would
# duplicate what http_requests_total already counts, at one line per request
# per service.
#
# JSON rather than the default combined format because the consumer is Loki:
# LogQL can filter on a parsed field and can only regex a text line.
#
# THREE DELIBERATE CHOICES ABOUT WHAT IS *NOT* HERE:
#
#   Not $request. It is the whole request line and carries the query string
#   with it. Anything a client puts in a query string — a token someone
#   pasted, an email in a search box — would be logged verbatim and shipped
#   to Loki. The PII is dropped at the source rather than scrubbed downstream.
#
#   Not $uri either, which was the first attempt and was wrong. $uri is the
#   NORMALISED, POST-REWRITE path: `try_files $uri $uri/ /index.html` below
#   rewrites every unmatched front-end route internally, so $uri logs
#   "/index.html" for all of them and the path the client actually asked for
#   is lost. Confirmed by running it — a request for /metrics logged as
#   /index.html. Fine for /api/* (nothing rewrites those), useless for
#   everything else.
#
#   So: $request_path, from the map below. It is $request_uri with the query
#   string cut off — the ORIGINAL path, without the PII.
#
#   escape=json is what stops a crafted path from terminating the JSON string
#   and forging additional fields. Without it a request for a path containing
#   a double quote produces a malformed line that Loki's parser rejects, and
#   a carefully chosen one produces a line that parses as attacker-chosen
#   fields. It is a correctness fix and a security fix at once.
#
# The map runs once per request, before any rewriting. The regex is greedy up
# to the first "?", and the default covers the case where $request_uri is
# unset (an internal request that never had a request line).
map $request_uri $request_path {
    default        "-";
    ~^(?<path>[^?]*) $path;
}
#
# $request_time and $upstream_response_time together are what answer the
# pre-demo checklist's "where's the slowest hop": total time as the client
# experienced it, versus time spent waiting on a backend. The difference is
# nginx's own overhead.
# ---------------------------------------------------------------------------
log_format json_combined escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"method":"$request_method",'
    '"path":"$request_path",'
    '"served_path":"$uri",'
    '"status":$status,'
    '"duration_seconds":$request_time,'
    '"upstream_seconds":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,'
    '"user_agent":"$http_user_agent"'
'}';

# ---------------------------------------------------------------------------
# stub_status, for the nginx-prometheus-exporter sidecar (Milestone 8).
#
# Bound to 127.0.0.1 ON PURPOSE. A pod's localhost is the pod itself, so this
# listener is reachable from the exporter sidecar sharing the network
# namespace and from nowhere else — not from another pod, not through the
# Service, not through the ALB. That is what makes the gateway's /metrics
# "internal-only" a property of the socket rather than a promise.
#
# BEING HONEST ABOUT WHAT THIS GIVES: stub_status reports connections
# accepted/handled/active and a total request counter. Open-source nginx does
# not expose per-route status codes or latency at all — that is an NGINX Plus
# feature. So the gateway's /metrics proves liveness and traffic volume, and
# nothing more.
#
# That is exactly why the JSON access log above is not decoration: gateway
# error rate and latency come from LogQL over Loki, not from this endpoint.
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8081;

    location /stub_status {
        stub_status;
    }

    # Nothing else on this listener. Without this, any other path here would
    # fall through to nginx's default 404 page, which is harmless but makes
    # the listener look like a general-purpose server rather than one endpoint.
    location / {
        return 404;
    }
}

server {
    listen 80;
    client_max_body_size 2m;

    access_log /var/log/nginx/access.log json_combined;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Route paths below are fixed by the frontend's API contract (see
    # frontend/src — it calls these exact paths) and by the Architecture
    # table in the top-level README — don't change the location blocks
    # themselves. What IS yours to decide: the upstream hostname each one
    # proxies to.
    #
    # The hostnames below are the Compose service names, and they are
    # deliberately identical to the Kubernetes Service names used later, so
    # this file works unchanged in both environments. All five FastAPI
    # services listen on container port 8000.

    location /api/auth/ {
        proxy_pass http://auth-service:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/products {
        proxy_pass http://catalog-service:8000;
        include /etc/nginx/proxy_params.conf;
    }

    # Internal endpoints exposed for course demos only — a production
    # gateway would keep these private to the service network.
    location /api/internal/ {
        proxy_pass http://catalog-service:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/cart {
        proxy_pass http://cart-service:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/orders {
        proxy_pass http://order-service:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/payments {
        proxy_pass http://payment-service:8000;
        include /etc/nginx/proxy_params.conf;
    }
}
