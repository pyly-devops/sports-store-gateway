# CI for the gateway (Milestone 6).
#
# Two jobs, and the split between them is the security boundary:
#
#   verify   runs on every pull request AND on every push to main. It holds
#            `contents: read` and nothing else, so it cannot even ask for an
#            OIDC token, let alone reach AWS.
#   publish  runs only on main, only after verify passed, and is the only job
#            in this repo that requests `id-token: write`.
#
# What actually stops a pull request from publishing is not the `if:` below -
# it is the trust policy on github-actions-sports-store-gateway-ecr-push,
# whose sub condition is
# `repo:pyly-devops/sports-store-gateway:ref:refs/heads/main`. A PR run's
# token carries `...:pull_request`, which never matches, so the AssumeRole
# call fails outright. The `if:` makes that visible in the file; it is not
# what makes it true.
#
# The gateway is the one repo whose Dockerfile starts `FROM ${FRONTEND_IMAGE}`
# - a pull from a sibling repo's ECR image. On a PR there is no AWS identity
# at all, so that pull cannot happen. FRONTEND_IMAGE_TAG names the exact
# frontend commit the gateway is built against; because every repo in the org
# is public, `verify` rebuilds that same commit from source with no token,
# instead of skipping the image build or weakening the OIDC trust to buy a PR
# a read-only ECR role.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a main run. A cancelled main run is a
# commit with no image in ECR, and because the next merge produces a different
# hash, nothing ever retroactively builds it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned frontend build
        id: pin
        run: |
          set -euo pipefail
          tag=$(tr -d ' \n' < FRONTEND_IMAGE_TAG)
          echo "tag=$tag"        >> "$GITHUB_OUTPUT"
          echo "sha=${tag##*-}"  >> "$GITHUB_OUTPUT"   # 0.1.0-fd06de1 -> fd06de1

      # actions/checkout only recognises a `ref:` as a commit fetch when it is
      # the full 40-character SHA - a short SHA is treated as a branch/tag name
      # glob instead, which does not exist, so the fetch fails outright rather
      # than falling back to a full-history fetch. Resolving it first through
      # the REST API (GITHUB_TOKEN only raises the rate limit here; the repo
      # itself is public) is what makes the pin actually work.
      - name: Resolve the pinned commit to a full SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          full=$(gh api repos/pyly-devops/sports-store-frontend/commits/${{ steps.pin.outputs.sha }} --jq .sha)
          echo "full=$full" >> "$GITHUB_OUTPUT"

      # Public repo, no token needed for the checkout itself. The commit is
      # named by the pin, so this builds the same bytes the ECR image holds -
      # not "whatever main is today".
      - uses: actions/checkout@v4
        with:
          repository: pyly-devops/sports-store-frontend
          ref: ${{ steps.resolve.outputs.full }}
          path: .frontend

      - run: docker build --platform linux/amd64 -t frontend-pr:local .frontend

      - run: |
          docker build --platform linux/amd64 \
            --build-arg FRONTEND_IMAGE=frontend-pr:local \
            -t ci:${{ github.sha }} .

      # nginx.conf is the whole point of this repo. NGINX resolves literal
      # proxy_pass hostnames at config-load time, and the five Kubernetes
      # Service names do not exist on a runner - mapping them to 127.0.0.1
      # tests the config's syntax, not the runner's DNS.
      - name: nginx.conf parses
        run: |
          docker run --rm \
            --add-host auth-service:127.0.0.1 \
            --add-host catalog-service:127.0.0.1 \
            --add-host cart-service:127.0.0.1 \
            --add-host order-service:127.0.0.1 \
            --add-host payment-service:127.0.0.1 \
            ci:${{ github.sha }} nginx -t

      - name: The bundle landed where NGINX serves from
        run: docker run --rm ci:${{ github.sha }} ls /usr/share/nginx/html/index.html

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Matches var.app_components in sports-store-infrastructure.
      ECR_REPOSITORY: sports-store/gateway
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # No static AWS keys, ever (CLAUDE.md). vars.AWS_ACCOUNT_ID is a GitHub
      # Actions ORGANISATION variable, not a secret: an account id
      # authenticates as nothing and is already in git in the deployments
      # repo. It lives in one place so a new account is one edit rather than
      # seven PRs. The role name is written out because a reviewer should be
      # able to see what this file publishes as without opening settings.
      #
      # This role also needs ecr:BatchGetImage / GetDownloadUrlForLayer /
      # BatchCheckLayerAvailability on sports-store/frontend to pull the base
      # image below - the one documented exception to "every push role is
      # scoped to its own repository only". See
      # sports-store-infrastructure/envs/prod/github-oidc.tf,
      # gateway_frontend_pull.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-sports-store-gateway-ecr-push
          aws-region: us-east-1 # matches envs/prod/variables.tf

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Compute the tag
        id: tag
        run: |
          set -euo pipefail
          version=$(tr -d ' \n' < VERSION)
          case "$version" in
            latest|"") echo "::error::VERSION must not be '$version'"; exit 1 ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION is not semver: '$version'"; exit 1 ;;
          esac
          # git's own answer, not ${GITHUB_SHA:0:7}. The workspace Makefile
          # uses --short=7 too, so the two can never disagree about a commit
          # even on the day git needs eight characters to disambiguate.
          echo "tag=$version-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$ECR_REPOSITORY:$TAG"

          # Unlike the PR job, this pulls the pinned frontend straight from
          # ECR rather than rebuilding it from source - the published image
          # must be the exact artifact the frontend's own pipeline built,
          # tagged and pushed, not a second build of the same commit.
          frontend="$REGISTRY/sports-store/frontend:$(tr -d ' \n' < FRONTEND_IMAGE_TAG)"

          # Plain docker build + push, NOT docker/build-push-action: buildx
          # pushes an image index carrying provenance attestations, which show
          # up in the ECR console as a phantom unknown/unknown platform next to
          # every image. If this ever moves to buildx for its cache backends,
          # it needs `provenance: false`.
          docker build --platform linux/amd64 \
            --build-arg FRONTEND_IMAGE="$frontend" -t "$image" .

          # ECR repositories are IMMUTABLE (Milestone 4). Re-running this
          # workflow on the same commit would otherwise die on a tag that
          # already exists - the least useful red X there is. Same guard as the
          # workspace Makefile's push_if_new.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "already in ECR, tag not moved: $image"
          else
            docker push "$image"
          fi

          # bump-deployment (below) reads this job's `tag` output and opens
          # the PR that used to be a human's copy-paste into the deployments
          # repo's environments/production/images/gateway.yaml.
          echo "Pushed \`$TAG\` to \`$ECR_REPOSITORY\`" >> "$GITHUB_STEP_SUMMARY"

  # Separate job, not steps appended to publish: it puts the AWS identity and
  # the git-write identity on different runners. publish can push an image and
  # cannot touch git; this job can open a PR and cannot reach AWS.
  bump-deployment:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {} # GITHUB_TOKEN cannot write to another repo at ANY level, so granting it anything here is theatre.
    env:
      SERVICE: gateway
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      # Mints a token scoped to exactly this App's installation on
      # sports-store-deployments — a separate mint from frontend-bump.yml's,
      # which is scoped to this repo (sports-store-gateway) instead.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPLOY_BOT_PRIVATE_KEY }}
          owner: pyly-devops
          repositories: sports-store-deployments

      # ref: deploy/gateway is deliberately NOT passed here.
      # actions/checkout fails the whole step with "couldn't find remote
      # ref" if the ref doesn't exist yet — which it won't, on the very
      # first bump ever — so main is checked out unconditionally and the
      # deploy branch (if any) is created/moved onto below instead.
      - uses: actions/checkout@v4
        with:
          repository: pyly-devops/sports-store-deployments
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Set BEFORE the merge below, not just before the commit further down.
      # A merge that isn't a fast-forward writes a merge commit, and git
      # refuses to write any commit without an identity. Configuring this
      # only in `Commit` made every bump fail with
      #
      #   fatal: empty ident name (for <runner@...>) not allowed
      #
      # whenever the previous bump was still an open PR — which is the normal
      # state of the stable-branch design below, not an edge case. Invisible
      # until then because a fast-forward writes no commit and needs no
      # identity. Broke all six publishing repos on 2026-08-07.
      - name: Configure the bot's git identity
        run: |
          set -euo pipefail
          git config user.name "cloudcart-deploy-argocd-bot[bot]"
          git config user.email "cloudcart-deploy-argocd-bot[bot]@users.noreply.github.com"

      # A stable branch name, no tag in it: deploy/gateway means "the
      # pending bump for gateway", of which there is exactly one. Never
      # rebase, this repo never force-pushes — merge main into whatever the
      # branch already had, or start it fresh off main if this is the first
      # bump ever.
      - name: Move onto deploy/gateway, merging main in
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin deploy/gateway >/dev/null; then
            git checkout -B deploy/gateway origin/deploy/gateway
            # Only call it a conflict once there are actually unmerged paths.
            # This handler used to report EVERY merge failure as a conflict,
            # which is precisely what hid the missing-identity fatal above it
            # and sent a reader hunting for a content conflict that never
            # existed. git's own message stays in the log either way.
            if ! git merge --no-edit origin/main; then
              if [ -n "$(git ls-files --unmerged)" ]; then
                echo "::error::merge conflict against main on deploy/gateway — needs a human" >&2
              else
                echo "::error::git merge failed for a non-conflict reason — see the git output above" >&2
              fi
              exit 1
            fi
          else
            git checkout -B deploy/gateway
          fi

      - name: Install yq
        run: |
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Bump the image tag
        run: |
          set -euo pipefail
          yq -i '.services[strenv(SERVICE)].image.tag = strenv(TAG)' \
            helm/sports-store/environments/production/images/gateway.yaml

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no change — tag already at $TAG"
            exit 0
          fi
          # Identity is configured once, before the merge — see the step above.
          git add helm/sports-store/environments/production/images/gateway.yaml
          git commit -m "Bump gateway to ${TAG}"
          git push origin HEAD:deploy/gateway

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # `gh pr view` finds a PR by head branch regardless of state — a
          # branch whose only-ever PR already merged still "exists" to a
          # bare existence check, so this used to edit the OLD merged PR's
          # body and leave the new commit on the branch with nothing open
          # to land it. Found live (M8 Tier 4 verification, 2026-08-07):
          # every service's SECOND deploy ever did this silently. Checking
          # state explicitly is the fix — anything but OPEN needs a new PR.
          STATE=$(gh pr view deploy/gateway --repo pyly-devops/sports-store-deployments --json state --jq .state 2>/dev/null || echo NONE)
          if [ "$STATE" = "OPEN" ]; then
            gh pr edit deploy/gateway --repo pyly-devops/sports-store-deployments \
              --body "Bumps \`gateway\` to \`${TAG}\`. Merging this **is** the deploy — Argo CD picks it up automatically."
          else
            gh pr create --repo pyly-devops/sports-store-deployments \
              --head deploy/gateway --base main \
              --title "Bump gateway to ${TAG}" \
              --body "Bumps \`gateway\` to \`${TAG}\`. Merging this **is** the deploy — Argo CD picks it up automatically."
          fi
